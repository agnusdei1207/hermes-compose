services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    user: root
    restart: unless-stopped
    command: gateway run
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"
    volumes:
      - ${HERMES_HOST_DIR:-~/.hermes}:/opt/data
      - ${HERMES_HOST_DIR:-~/.hermes}:/root/.hermes
    env_file:
      - path: .env
        required: false
      - path: ${HERMES_HOST_DIR:-~/.hermes}/.env
        required: false
    networks:
      - hermes_network
    environment:
      HERMES_HOME: /opt/data
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: admin
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: admin1234
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: n5tcxptcl90skn3n2jag88n7f8rdm5fdei76hmmp
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: 7zrd3vdl2w8j7salkk8e

networks:
  hermes_network:
    name: hermes_network
    driver: bridge
